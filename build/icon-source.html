<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body { margin: 0; padding: 0; width: 1024px; height: 1024px; background: transparent; }
</style>
</head>
<body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="1024" rx="220" fill="url(#bg)"/>
  <g stroke="#f0fdff" stroke-width="34" stroke-linecap="round" fill="none">
    <!-- 8 spokes -->
    <line x1="512" y1="180" x2="512" y2="844"/>
    <line x1="180" y1="512" x2="844" y2="512"/>
    <line x1="290" y1="290" x2="734" y2="734"/>
    <line x1="734" y1="290" x2="290" y2="734"/>
  </g>
  <!-- outer rim -->
  <circle cx="512" cy="512" r="332" fill="none" stroke="#f0fdff" stroke-width="34"/>
  <!-- 8 handles at spoke tips -->
  <g fill="#f0fdff">
    <circle cx="512" cy="180" r="26"/>
    <circle cx="512" cy="844" r="26"/>
    <circle cx="180" cy="512" r="26"/>
    <circle cx="844" cy="512" r="26"/>
    <circle cx="290" cy="290" r="26"/>
    <circle cx="734" cy="734" r="26"/>
    <circle cx="734" cy="290" r="26"/>
    <circle cx="290" cy="734" r="26"/>
  </g>
  <!-- hub -->
  <circle cx="512" cy="512" r="118" fill="#0e7490" stroke="#f0fdff" stroke-width="28"/>
</svg>
</body>
</html>
