appId: dev.babug01.kubewheel
productName: Kubewheel
directories:
  buildResources: build
files:
  - out/**/*
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: kubewheel-v${version}-windows-${arch}-setup.${ext}
portable:
  artifactName: kubewheel-v${version}-windows-${arch}-portable.${ext}
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  artifactName: kubewheel-v${version}-macos-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Development
  artifactName: kubewheel-v${version}-linux-${arch}.${ext}
publish:
  provider: github
  owner: Babug01
  repo: kubewheel
  releaseType: release
